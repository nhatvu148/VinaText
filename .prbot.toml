# pr-review-bot, per-repo settings.
#
# Two things about this repository make the defaults a poor fit, and both are
# consequences of the Qt port rather than opinions about reviewing:
#
#  1. Packages/data-packages/*.json is GENERATED, from the C++ tables in src/, by
#     tools/extract_language_data.py. Reviewing it wastes the whole budget on
#     data nobody hand-writes: one keyword blob is a single 65,000-character
#     line, and in PR #31 those unchanged lines arrived as 138,769 characters of
#     diff CONTEXT around 11,509 characters of real change. It is also the only
#     file here with a stronger check than review already: `--verify` reproduces
#     it from the C++ on every CI run, and core/tests/ differential-tests the
#     lookups against a transcription of the MFC original.
#
#  2. This repo vendors a lot of third-party source it must not edit — Scintilla,
#     Lexilla, curl, uchardet, tinyXml, PDFium's UXReader. See CLAUDE.md: "Do not
#     rewrite vendored code." A review that proposes changes there is proposing
#     something the project cannot accept; the remedy is an upstream patch or a
#     version bump.

# REPLACES the built-in list, so the conventional entries are repeated here.
exclude_globs = [
  # --- conventional defaults, carried over ---
  "**/*.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/bun.lockb",
  "**/Cargo.lock",
  "**/go.sum",
  "**/composer.lock",
  "**/Gemfile.lock",
  "**/poetry.lock",
  "**/*.min.js",
  "**/*.min.css",
  "**/dist/**",
  "**/build/**",
  "**/vendor/**",
  "**/node_modules/**",
  "**/*.snap",
  "**/__snapshots__/**",
  "**/*.pb.go",
  "**/*_generated.*",
  "**/*.generated.*",

  # --- this repo ---
  # Generated by tools/extract_language_data.py and verified by --verify in CI.
  # The extractor and the tests that check it are NOT excluded: that is where a
  # mistake in this data would actually come from, and it is worth reviewing.
  "Packages/data-packages/*.json",
  # Build outputs the MFC PostBuildEvent writes next to the executable.
  "bin/**",
]

# Marks third-party source. Findings inside are suppressed and the reviewer is
# told not to propose edits. REPLACES the conventional defaults.
vendored = [
  "thirdparty/**",     # Scintilla + Lexilla, vendored deliberately (brief D2)
  "include/**",        # curl, json, scintilla headers
  "lib/**",
  "src/uchardet/**",
  "src/tinyXml/**",
  "src/pdf/**",
]
