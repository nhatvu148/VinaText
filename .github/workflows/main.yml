name: Main pipeline

# Triggers
# --------
# The previous config used `branches-ignore: ['*']`, intended to disable push
# builds. It did not work as intended: `*` does not match `/`, so branches like
# `port/cross-platform` still triggered a run while `master` did not. And
# `pull_request` only fired for PRs into `master`, so PRs into the port branch
# got no checks at all. Both are spelled out explicitly below.
on:
  push:
    branches:
      - master
      - port/cross-platform
      - 'phase*/**'
      - 'ci/**'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - port/cross-platform
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Portable checks. These run everywhere and are the only signal available to
  # developers on macOS/Linux, who cannot build the MFC application at all.
  # Both jobs no-op cleanly on branches where the relevant paths do not exist.
  # ---------------------------------------------------------------------------
  data-verify:
    name: Verify extracted language data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe for the extractor
        id: probe
        run: |
          if [ -f tools/extract_language_data.py ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "tools/extract_language_data.py not on this branch - skipping"
          fi

      # Asserts the JSON in Packages/data-packages still reproduces the C++
      # tables in src/EditorColor{Light,Dark}.h exactly. Guards against the two
      # drifting apart while both are present in the tree.
      - name: Round-trip JSON against the C++ tables
        if: steps.probe.outputs.present == 'yes'
        run: python3 tools/extract_language_data.py --verify

  core-tests:
    name: core/ CMake build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Probe for the CMake build
        id: probe
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "CMakeLists.txt not on this branch - skipping"
          fi

      # core/ must build with no MFC, no Win32 and no precompiled header, and the
      # CMake target compiles it with -Wall -Wextra -Werror. A stray platform API
      # or a missing include fails here rather than at Phase 3.
      - name: Configure
        if: steps.probe.outputs.present == 'yes'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.probe.outputs.present == 'yes'
        run: cmake --build build --parallel

      - name: Test
        if: steps.probe.outputs.present == 'yes'
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # The Qt alpha shell. Builds Scintilla + Lexilla from source and runs the shell
  # headlessly through D9's checklist - tabs, open/save, lexer, both themes, find,
  # status bar - then renders both themes to PNGs and uploads them, so the alpha
  # can be looked at without building it.
  # ---------------------------------------------------------------------------
  qt-spike:
    name: Qt alpha shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Probe for ui-qt/
        id: probe
        run: |
          if [ -f ui-qt/CMakeLists.txt ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "ui-qt/ not on this branch - skipping"
          fi

      - name: Install Qt (Linux)
        if: steps.probe.outputs.present == 'yes' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # Core5Compat is required: ScintillaEditBase uses QTextCodec.
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-5compat-dev libgl1-mesa-dev ninja-build

      - name: Install Qt (macOS)
        if: steps.probe.outputs.present == 'yes' && runner.os == 'macOS'
        run: brew install qt ninja

      - name: Configure
        if: steps.probe.outputs.present == 'yes'
        run: |
          PREFIX=""
          [ "$RUNNER_OS" = "macOS" ] && PREFIX="-DCMAKE_PREFIX_PATH=$(brew --prefix qt)"
          cmake -S . -B qtbuild -G Ninja -DVINATEXT_BUILD_QT=ON \
                -DCMAKE_BUILD_TYPE=Release $PREFIX

      - name: Build
        if: steps.probe.outputs.present == 'yes'
        run: cmake --build qtbuild --parallel

      # "It compiled" is not evidence the editor edits, and CI cannot click. The
      # self-test opens real files in tabs, asserts each got a lexer and more than
      # one distinct style, switches both themes and asserts the colours actually
      # changed, runs find (including a zero-length regex, which hangs without the
      # guard in HighlightMatches), reads the status bar back, and saves every
      # document to a temporary copy that must be BYTE-IDENTICAL to the original.
      #
      # The four files are chosen for their encodings and line endings, not their
      # contents: CRLF+BOM, UTF-16, Latin-1 and a plain LF file with no trailing
      # newline. An editor that cannot round-trip those corrupts the first file a
      # user opens with it.
      - name: Build the encoding fixtures
        if: steps.probe.outputs.present == 'yes'
        run: python3 tools/make_selftest_fixtures.py qtbuild/fixtures

      - name: Self-test (headless)
        if: steps.probe.outputs.present == 'yes'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ./qtbuild/ui-qt/vinatext-qt --selftest \
            core/LanguageData.cpp tools/extract_language_data.py \
            qtbuild/fixtures/crlf-bom.cpp qtbuild/fixtures/utf16.py \
            qtbuild/fixtures/latin1.md qtbuild/fixtures/no-trailing-newline.py

      # A port whose whole point is that it now runs somewhere other than Windows
      # should be able to show that without asking anyone to build it.
      - name: Render both themes
        if: steps.probe.outputs.present == 'yes'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          mkdir -p qtbuild/screenshots
          ./qtbuild/ui-qt/vinatext-qt --screenshot qtbuild/screenshots \
            core/LanguageData.cpp ui-qt/MainWindow.cpp

      - name: Upload the screenshots
        if: steps.probe.outputs.present == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: vinatext-qt-${{ matrix.os }}
          path: qtbuild/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The Windows MFC build. This is the regression test that matters: per D5 the
  # MFC frontend must keep building throughout the port, and on a long-lived
  # branch (D4) this job is the only thing checking that.
  # ---------------------------------------------------------------------------
  windows-build:
    name: MFC build (Release|x64)
    # Pinned deliberately, NOT windows-latest. windows-latest has rolled to
    # VS 18, whose image does not ship MFC/ATL - that is what was failing with
    # "error MSB8041: MFC libraries are required for this project". The project
    # is <UseOfMfc>Dynamic</UseOfMfc> on PlatformToolset v143, which is VS 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The pinned image is expected to already carry ATL/MFC. Verify rather
      # than assume, and install on demand if a future image drops it, so this
      # fails with a clear message instead of MSB8041 deep inside the build.
      - name: Ensure MFC/ATL components are present
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $withMfc = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if ($withMfc) {
            Write-Host "MFC present: $withMfc"
            exit 0
          }
          Write-Host "MFC not found - installing Microsoft.VisualStudio.Component.VC.ATLMFC"
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw "no Visual Studio installation found" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
            "--quiet", "--norestart", "--nocache"
          )
          if ($p.ExitCode -ne 0) { throw "vs_installer failed with exit code $($p.ExitCode)" }
          Write-Host "MFC installed"

      # Release|x64 only. The solution also declares Win32 configurations, but
      # no 32-bit binaries are shipped and lib/ only carries x64 prebuilts.
      - name: Build VinaText.sln
        shell: cmd
        run: msbuild VinaText.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal /nologo

      # The PostBuildEvent xcopies Packages/ next to the executable. Nothing else
      # checks it, and getting it wrong means the app starts and then cannot find
      # any of its data - the failure that went unnoticed through PRs #4-#17
      # because CI compiles the MFC app but never runs it.
      - name: Verify Packages/ was deployed next to the exe
        shell: pwsh
        run: |
          $out = "bin/x64/Release/Packages"
          $required = @(
            "data-packages/languages.json",
            "data-packages/theme-light.json",
            "data-packages/theme-dark.json",
            "data-packages/syntax-highlight-file-extension.dat",
            "language-packages/cpp-data.ee-package"
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path "$out/$f")) { $missing += $f }
          }
          $count = (Get-ChildItem -Recurse -File $out -ErrorAction SilentlyContinue).Count
          Write-Host "$out contains $count files"
          if ($missing.Count -gt 0) {
            Write-Host "MISSING from the output directory:"
            $missing | ForEach-Object { Write-Host "  $_" }
            throw "PostBuildEvent did not deploy Packages/"
          }
          # Source and deployed copy must agree, or the copy is stale.
          $a = (Get-FileHash "Packages/data-packages/languages.json").Hash
          $b = (Get-FileHash "$out/data-packages/languages.json").Hash
          if ($a -ne $b) { throw "deployed languages.json differs from Packages/" }
          Write-Host "Packages/ deployed and matching source"

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VinaText-Release-x64
          path: |
            bin/x64/Release/VinaText.exe
          if-no-files-found: warn
          retention-days: 7
